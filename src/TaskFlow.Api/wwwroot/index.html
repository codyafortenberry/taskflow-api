<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel-2: #273449; --text: #e2e8f0;
      --muted: #94a3b8; --accent: #6366f1; --accent-hover: #4f46e5; --border: #334155;
      --todo: #64748b; --progress: #3b82f6; --review: #a855f7; --done: #22c55e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
    header h1 span { color: var(--accent); }
    .muted { color: var(--muted); font-size: 13px; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 9px 14px;
      background: var(--accent); color: white; font-size: 14px; font-weight: 600; }
    button:hover { background: var(--accent-hover); }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .login { max-width: 380px; margin: 8vh auto; background: var(--panel); padding: 28px;
      border-radius: 14px; border: 1px solid var(--border); }
    .login h2 { margin-top: 0; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
    .error { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 16px; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 8px; }
    .col { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .col h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; margin: 4px 4px 12px;
      display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 10px; }
    .card .title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .card .desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pri { font-size: 11px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); }
    .card select { width: auto; padding: 4px 6px; font-size: 12px; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin: 18px 0 6px; }
    .toolbar .grow { flex: 1; }
    dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--panel);
      color: var(--text); width: 420px; max-width: 92vw; padding: 22px; }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <!-- Login view -->
  <div id="loginView">
    <div class="login">
      <h2>Task<span style="color:var(--accent)">Flow</span></h2>
      <p class="muted">Sign in to your workspace</p>
      <label>Email</label>
      <input id="email" type="email" value="admin@taskflow.dev" autocomplete="username" />
      <label>Password</label>
      <input id="password" type="password" value="Password123" autocomplete="current-password" />
      <div class="error" id="loginError"></div>
      <button style="width:100%; margin-top:16px" onclick="login()">Sign in</button>
      <p class="hint">Seeded demo accounts:<br />
        <strong>admin@taskflow.dev</strong> / Password123<br />
        <strong>member@taskflow.dev</strong> / Password123<br />
        Interactive API docs (Swagger UI) at <a href="/swagger" target="_blank">/swagger</a>.
      </p>
    </div>
  </div>

  <!-- App view -->
  <div id="appView" style="display:none">
    <header>
      <h1>Task<span>Flow</span></h1>
      <div class="row" style="gap:14px">
        <span class="muted" id="whoami"></span>
        <a class="muted" href="/swagger" target="_blank">API docs</a>
        <button class="ghost" id="copyTokenBtn" onclick="copyToken()"
          title="Copy your JWT, then paste it into Swagger's Authorize dialog">Copy token</button>
        <button class="ghost" onclick="logout()">Sign out</button>
      </div>
    </header>
    <div class="wrap">
      <div class="toolbar">
        <strong id="projectName">Tasks</strong>
        <span class="grow"></span>
        <input id="search" placeholder="Search tasks…" style="max-width:240px" oninput="debouncedLoad()" />
        <button onclick="openCreate()">+ New task</button>
      </div>
      <div class="board" id="board"></div>
    </div>
  </div>

  <!-- Create task dialog -->
  <dialog id="createDialog">
    <h3 style="margin-top:0">New task</h3>
    <label>Title</label>
    <input id="ntTitle" />
    <label>Description</label>
    <textarea id="ntDesc" rows="3"></textarea>
    <label>Priority</label>
    <select id="ntPriority">
      <option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option>
    </select>
    <label>Assignee</label>
    <select id="ntAssignee"><option value="">Unassigned</option></select>
    <div class="error" id="createError"></div>
    <div class="dialog-actions">
      <button class="ghost" onclick="createDialog.close()">Cancel</button>
      <button onclick="createTask()">Create</button>
    </div>
  </dialog>

  <script>
    const COLUMNS = [
      { key: 'Todo', label: 'To Do', color: 'var(--todo)' },
      { key: 'InProgress', label: 'In Progress', color: 'var(--progress)' },
      { key: 'InReview', label: 'In Review', color: 'var(--review)' },
      { key: 'Done', label: 'Done', color: 'var(--done)' },
    ];
    let token = localStorage.getItem('tf_token');
    let me = JSON.parse(localStorage.getItem('tf_user') || 'null');
    let projectId = null, users = [], tasks = [];

    async function api(path, options = {}) {
      const res = await fetch('/api/v1' + path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: 'Bearer ' + token } : {}),
          ...(options.headers || {}),
        },
      });
      if (res.status === 401) { logout(); throw new Error('Session expired'); }
      if (!res.ok) {
        const problem = await res.json().catch(() => ({}));
        throw new Error(problem.detail || problem.title || 'Request failed');
      }
      return res.status === 204 ? null : res.json();
    }

    async function login() {
      const err = document.getElementById('loginError');
      err.textContent = '';
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        token = data.accessToken; me = data.user;
        localStorage.setItem('tf_token', token);
        localStorage.setItem('tf_user', JSON.stringify(me));
        boot();
      } catch (e) { err.textContent = e.message; }
    }

    function logout() {
      token = null; me = null;
      localStorage.removeItem('tf_token'); localStorage.removeItem('tf_user');
      document.getElementById('appView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
    }

    async function boot() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('appView').style.display = 'block';
      document.getElementById('whoami').textContent = me ? `${me.displayName} · ${me.role}` : '';
      const projects = await api('/projects');
      const project = projects.items[0];
      if (project) {
        projectId = project.id;
        document.getElementById('projectName').textContent = `${project.key} · ${project.name}`;
      }
      users = (await api('/users')).items;
      const sel = document.getElementById('ntAssignee');
      sel.innerHTML = '<option value="">Unassigned</option>' +
        users.map(u => `<option value="${u.id}">${u.displayName}</option>`).join('');
      loadBoard();
    }

    let timer;
    function debouncedLoad() { clearTimeout(timer); timer = setTimeout(loadBoard, 250); }

    // Fetches the board from the server. Called on load, on search, and after
    // creating a task — i.e. when the whole list may have changed.
    async function loadBoard() {
      const search = document.getElementById('search').value.trim();
      const q = new URLSearchParams({ pageSize: '100' });
      if (projectId) q.set('projectId', projectId);
      if (search) q.set('search', search);
      const data = await api('/tasks?' + q.toString());
      tasks = data.items;
      renderBoard();
    }

    // Renders columns from the in-memory `tasks` array — no network call.
    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = COLUMNS.map(col => {
        const inColumn = tasks.filter(t => t.status === col.key);
        const cards = inColumn.map(renderCard).join('');
        return `<div class="col">
          <h3><span class="dot" style="background:${col.color}"></span>${col.label}
            <span class="muted" style="margin-left:auto">${inColumn.length}</span>
          </h3>${cards || '<p class="muted" style="margin:6px;font-size:12px">No tasks</p>'}</div>`;
      }).join('');
    }

    function renderCard(t) {
      const options = COLUMNS.map(c =>
        `<option value="${c.key}" ${c.key === t.status ? 'selected' : ''}>${c.label}</option>`).join('');
      const assignee = t.assignee ? t.assignee.displayName : 'Unassigned';
      return `<div class="card">
        <div class="title">${escapeHtml(t.title)}</div>
        ${t.description ? `<div class="desc">${escapeHtml(t.description)}</div>` : ''}
        <div class="row">
          <span class="pri">${t.priority}</span>
          <span class="muted" style="font-size:11px">${escapeHtml(assignee)}</span>
        </div>
        <div class="row" style="margin-top:8px">
          <select onchange="changeStatus('${t.id}', this.value)">${options}</select>
        </div>
      </div>`;
    }

    async function changeStatus(id, status) {
      // PATCH returns the updated task, so we update local state from the response
      // and re-render — no follow-up GET needed.
      const updated = await api(`/tasks/${id}/status`, {
        method: 'PATCH', body: JSON.stringify({ status }),
      });
      tasks = tasks.map(t => (t.id === updated.id ? updated : t));
      renderBoard();
    }

    async function copyToken() {
      const btn = document.getElementById('copyTokenBtn');
      if (!token) { flashButton(btn, 'No token'); return; }

      let copied = false;
      try {
        await navigator.clipboard.writeText(token);
        copied = true;
      } catch {
        copied = fallbackCopy(token); // older browsers / no async Clipboard API
      }
      flashButton(btn, copied ? 'Copied!' : 'Press ⌘/Ctrl+C');
    }

    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch { return false; }
    }

    function flashButton(btn, message) {
      btn.textContent = message;
      setTimeout(() => { btn.textContent = 'Copy token'; }, 1500);
    }

    const createDialog = document.getElementById('createDialog');
    function openCreate() { document.getElementById('createError').textContent = ''; createDialog.showModal(); }
    async function createTask() {
      const err = document.getElementById('createError');
      err.textContent = '';
      try {
        await api('/tasks', {
          method: 'POST',
          body: JSON.stringify({
            projectId,
            title: document.getElementById('ntTitle').value,
            description: document.getElementById('ntDesc').value || null,
            priority: document.getElementById('ntPriority').value,
            assigneeId: document.getElementById('ntAssignee').value || null,
          }),
        });
        createDialog.close();
        document.getElementById('ntTitle').value = '';
        document.getElementById('ntDesc').value = '';
        loadBoard();
      } catch (e) { err.textContent = e.message; }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Auto-resume session.
    if (token) boot().catch(logout);
  </script>
</body>
</html>
